[project]
name = "mentor"
version = "0.1.0"
description = "Multi-agent systematic review assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "smolagents>=1.26,<2",
  "openai>=2.0,<3",
  "pandas>=2.2,<4",
  "python-dotenv>=1.0,<2",
  "mcp[cli]>=1.0,<3",
]

[project.optional-dependencies]
# Screening dashboards, Plotly charts, and matplotlib leaderboard plots.
experiments = [
  "streamlit==1.58.0",
  "plotly==6.8.0",
  "matplotlib>=3.8,<4",
]
litellm = ["litellm>=1.40,<2"]
dev = ["pytest>=7,<10"]
# Presentation helpers under scripts/ (e.g. syntax highlighting).
scripts = ["pygments>=2.16,<3"]

[project.scripts]
mentor = "mentor.cli:main"
experiments = "experiments.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Map import package ``mentor`` onto the flat ``src/`` tree (``src/cli.py`` → ``mentor.cli``).
[tool.setuptools.package-dir]
mentor = "src"

[tool.setuptools]
packages = [
  "mentor",
  "mentor.agents",
  "mentor.agents.prompts",
  "mentor.agents.wrappers",
  "mentor.config",
  "mentor.errors",
  "mentor.logging",
  "mentor.runtime",
  "mentor.tools",
  "mentor.tools.search",
  "mentor.tools.search.mcp",
  "mentor.tools.search.models",
  "experiments",
  "experiments.dataset",
  "experiments.dataset.loaders",
  "experiments.harness",
  "experiments.streamlit_app",
  "experiments.streamlit_app.pages",
  "experiments.suites",
]

[tool.setuptools.package-data]
"mentor" = [
  "agents/prompts/*.md",
  "config/*.json",
]
"experiments" = [
  "config/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Do not put ``src`` on pythonpath (would expose ``agents`` as a top-level import).
# Mentor comes from the editable install; experiments from the repo root.
pythonpath = ["."]
